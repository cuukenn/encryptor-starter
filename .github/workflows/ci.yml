# 每次 push 与 PR 都跑一遍构建 + 测试
name: Build & Test
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven
      # main-module = dependencies + core + starters；examples 是演示工程，不参与 CI 的测试闸门
      - name: Build & Test
        run: mvn -B -Pmain-module clean install
      # 演示工程与 JMH bench 不进测试闸门（HttpTest 需先起服务、JMH 在共享 runner 上噪声大），
      # 但必须保证它们能编译——否则示例/基准会悄悄烂掉（-DskipTests 仍会编译测试源码）
      - name: Build examples & bench (no tests)
        run: mvn -B -Pall-modules -DskipTests package
      # 双写面守卫：两份前端参考实现必须逐字节一致（AGENTS.md 的成对文件表）
      - name: Front-end reference impl must stay in sync
        run: diff -u encryptor-examples/web-example/front/encryptor/jwe.js encryptor-examples/gateway-example/gateway/front/encryptor/jwe.js
