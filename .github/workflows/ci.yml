# 每次 push 与 PR 都跑一遍构建 + 测试
name: Build & Test
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 主测试矩阵：JDK 8 是目标运行时；11/17 用来提前发现 JCE/Provider 与
        # 新版本 JDK 的反射/模块化差异（本项目的 ECDH-ES 依赖 SunEC）。
        java: [ '8', '11', '17' ]
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven
      # main-module = dependencies + core + sm + starters；examples 是演示工程，不参与 CI 的测试闸门
      - name: Build & Test
        run: mvn -B -Pmain-module clean install
      # 演示工程与 JMH bench 不进测试闸门（HttpTest 需先起服务、JMH 在共享 runner 上噪声大），
      # 但必须保证它们能编译——否则示例/基准会悄悄烂掉（-DskipTests 仍会编译测试源码）。
      # 只在 JDK 8 任务跑一次，避免矩阵里重复编译。
      - name: Build examples & bench (no tests)
        if: matrix.java == '8'
        run: mvn -B -Pall-modules -DskipTests package
      # 双写面守卫：三份前端参考实现必须两两侧字节一致
      # （javax web-example / javax gateway-example / boot3-example —— 第三份是逐字节拷贝，见 task-5）。
      # 三对全数 diff：任何一份漂移都会 fail。
      - name: Front-end reference impl must stay in sync (three copies)
        if: matrix.java == '8'
        run: |
          diff -u encryptor-examples/web-example/front/encryptor/jwe.js encryptor-examples/gateway-example/gateway/front/encryptor/jwe.js
          diff -u encryptor-examples/web-example/front/encryptor/jwe.js encryptor-examples/boot3-example/front/encryptor/jwe.js
          diff -u encryptor-examples/gateway-example/gateway/front/encryptor/jwe.js encryptor-examples/boot3-example/front/encryptor/jwe.js
      # 双线版本同步守卫：root project.version == encryptor.javax.line.version，
      # 且三个 boot3 pom 的 BOM import 必须经 property 引用（防 core 修复漏发 boot3 线）
      - name: Dual-line version sync guard
        if: matrix.java == '8'
        run: bash scripts/check-dual-line-versions.sh

      # servlet↔reactive 结构 parity 守卫（三面）：wire 常量值三处同值（两份 EncryptorConstant +
      # GatewayConstant 的 JWE_PARAM/TRACE_HEADER）；skip 配置类的字段/助手清单两侧一致；
      # 两侧 AutoConfiguration 的 @Bean 方法名集合一致——任一面漂移即红
      - name: Servlet-reactive structural parity guards
        if: matrix.java == '8'
        run: |
          python3 - <<'PY'
          import re, sys
          def vals(path):
              s = open(path).read()
              return {k: v for k, v in re.findall(r'String\s+(\w+)\s*=\s*"([^"]+)"', s)}
          e1 = vals('encryptor-starters/encryptor-starter/src/main/java/io/github/cuukenn/encryptor/constant/EncryptorConstant.java')
          e2 = vals('encryptor-starters/encryptor-starter-reactive/src/main/java/io/github/cuukenn/encryptor/reactive/constant/EncryptorConstant.java')
          g  = vals('encryptor-starters/encryptor-gateway-starter/src/main/java/io/github/cuukenn/encryptor/reactive/gateway/constant/GatewayConstant.java')
          for k in ('JWE_PARAM', 'TRACE_HEADER'):
              if k in e1 and k in e2 and e1[k] != e2[k]:
                  sys.exit(f'FAIL: EncryptorConstant.{k} servlet={e1[k]!r} reactive={e2[k]!r}')
              if k == 'JWE_PARAM' and k in g and k in e1 and g[k] != e1[k]:
                  sys.exit(f'FAIL: GatewayConstant.JWE_PARAM={g[k]!r} != EncryptorConstant.JWE_PARAM={e1[k]!r}')
          def inventory(path, patterns):
              s = open(path).read()
              return set(n for p in patterns for n in re.findall(p, s))
          cfg_patterns = [r'private final List<String> (skip\w+|black\w+)']
          web_cfg  = inventory('encryptor-starters/encryptor-web-starter/src/main/java/io/github/cuukenn/encryptor/web/config/WebEncryptorConfig.java', cfg_patterns)
          gw_cfg   = inventory('encryptor-starters/encryptor-gateway-starter/src/main/java/io/github/cuukenn/encryptor/reactive/gateway/config/GatewayEncryptorConfig.java', cfg_patterns)
          if web_cfg != gw_cfg:
              sys.exit(f'FAIL: skip 字段清单分叉 web={sorted(web_cfg)} gateway={sorted(gw_cfg)}')
          # skip 机制已下沉 core SkipListsConfigBase（2026-10-24 收敛 TOP1）：
          # 守卫改为断言两侧配置类都继承 base，且 base 内四个口径助手齐全
          base_path = 'encryptor-core/src/main/java/io/github/cuukenn/encryptor/config/base/SkipListsConfigBase.java'
          base_src = open(base_path).read()
          for helper in ('mergeAlias', 'warnUnmatchableCasing', 'warnParameterSuffix', 'initSkipLists'):
              if helper not in base_src:
                  sys.exit(f'FAIL: {base_path} 缺 {helper}（skip 口径机制被单侧拆走会静默漂移）')
          for path in ('encryptor-starters/encryptor-web-starter/src/main/java/io/github/cuukenn/encryptor/web/config/WebEncryptorConfig.java',
                       'encryptor-starters/encryptor-gateway-starter/src/main/java/io/github/cuukenn/encryptor/reactive/gateway/config/GatewayEncryptorConfig.java'):
              if 'extends SkipListsConfigBase' not in open(path).read():
                  sys.exit(f'FAIL: {path} 未继承 SkipListsConfigBase（skip 口径必须单点维护在 core）')
          def beans(path):
              s = open(path).read()
              return set(re.findall(r'public\s+\w[\w<>,\s]*?\s(\w+)\([^)]*\)\s*\{', s))
          a1 = beans('encryptor-starters/encryptor-starter/src/main/java/io/github/cuukenn/encryptor/configuration/EncryptorAutoConfiguration.java')
          a2 = beans('encryptor-starters/encryptor-starter-reactive/src/main/java/io/github/cuukenn/encryptor/reactive/configuration/EncryptorReactiveAutoConfiguration.java')
          core_beans = a1 & a2
          if 'defaultProtocol' not in core_beans or 'encryptorRuntime' not in core_beans:
              sys.exit(f'FAIL: 两侧 AutoConfiguration 的公共 bean 面缺失 defaultProtocol/encryptorRuntime（servlet={sorted(a1)} reactive={sorted(a2)}）')
          print('OK: structural parity (constants / skip-config inventory / autoconfig beans)')
          PY

      # servlet↔reactive 双写面守卫：两份 EncryptorConstant（JWE_PARAM/TRACE_HEADER）除 package 行外
      # 必须逐字节一致——常量不同值会让两侧 wire-format/trace 头分叉且 CI 全绿
      - name: EncryptorConstant parity (servlet vs reactive)
        if: matrix.java == '8'
        run: |
          diff <(tail -n +2 encryptor-starters/encryptor-starter/src/main/java/io/github/cuukenn/encryptor/constant/EncryptorConstant.java)                <(tail -n +2 encryptor-starters/encryptor-starter-reactive/src/main/java/io/github/cuukenn/encryptor/reactive/constant/EncryptorConstant.java)
      # 守卫脚本自身的自测（37 例）：脚本被改坏时 CI 必须红，否则复制对保护会静默失效
      - name: Guard script self-test
        if: matrix.java == '8'
        run: bash scripts/javax-to-jakarta.test.sh
      # 前端参考实现只做语法检查（端到端需先起服务，不进 CI 闸门）
      - name: Front-end JS syntax check
        if: matrix.java == '8'
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      # 依赖面守卫：core 与四个 starter 的 runtime/compile 依赖树不得出现 BC 或 encryptor-sm。
      # encryptor-sm 只允许被显式引入（示例/SM 用户），starter 不能把它或 BC 传递给消费者。
      - name: Guard BC-free runtime for core and starters
        if: matrix.java == '8'
        run: |
          rm -f /tmp/encryptor-runtime-tree.txt
          mvn -B -pl encryptor-core,encryptor-starters/encryptor-starter,encryptor-starters/encryptor-starter-reactive,encryptor-starters/encryptor-web-starter,encryptor-starters/encryptor-gateway-starter \
            dependency:tree -Dscope=runtime \
            -DoutputFile=/tmp/encryptor-runtime-tree.txt -DappendOutput=true
          # 注：这里输出全量树而非 -Dincludes 过滤树——零命中时过滤树文件为 0 字节，
          # 会让下方 test -s 在干净树（守卫的绿目标）必红；全量树恒非空，取证更完整。
          # 依赖树守卫的正向证据：outputFile 非空才可信（插件异常但 mvn 退出 0 的边缘
          # 场景会产出空文件，guard 若照常 grep 会平绿）。空/缺失一律 fail 并说明。
          test -s /tmp/encryptor-runtime-tree.txt || { echo "dependency:tree 未产出输出，guard 不可信" >&2; exit 1; }
          if grep -qE "org\\.bouncycastle|io\\.github\\.cuukenn:encryptor-sm" /tmp/encryptor-runtime-tree.txt; then
            echo "BouncyCastle or encryptor-sm leaked into a core/starter runtime tree" >&2
            cat /tmp/encryptor-runtime-tree.txt >&2
            exit 1
          fi

  boot3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # boot3 双线矩阵：17 是 Boot 3.5 的最低基线，21 用来提前发现新 JDK 的
        # JCE/反射/模块化差异；javax 线（build job）矩阵保持不变。
        java: [ '17', '21' ]
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven
      # -Pboot3 的 reactor 只含 4 个 boot3 模块（root pom 的模块表都在 profile 里，
      #  显式 -P 会停用 activeByDefault 的 all-modules）；boot3 复制线对
      # encryptor-core:1.0.0 的依赖经本地仓库解析，因此先把 javax 线制品装进 ~/.m2。
      # 跳过测试：javax 线的测试闸门已由 build job 负责，本 job 只需要它的制品。
      - name: Install javax-line prerequisites (core/starters into ~/.m2)
        run: mvn -B -Pmain-module -DskipTests clean install
      - name: Build & Test boot3 line
        run: mvn -B -Pboot3 -DtrimStackTrace=false clean install
      # 复制对 diff 守卫：三对 boot3 复制模块与 javax 对位做
      # "javax.servlet→jakarta.servlet 变换后逐字节一致"比对（共享的 reactive/micrometer
      # 无复制对，不在此 step）。gateway 对的 3 个 Spring API 改写文件按 task-5 口径
      # 登记 --expect-diff（pattern 必须以 main/java/... 起头，src 前缀不命中）。
      # --exclude spring.factories 登记的是 boot3 复制模块删旧装配文件（base 有 / copy 无）。
      # 两档矩阵里只跑一次，避免重复。
      - name: Guard copy-pair parity (javax vs jakarta line)
        if: matrix.java == '17'
        run: |
          bash scripts/javax-to-jakarta.sh --diff \
            encryptor-starters/encryptor-starter/src encryptor-starters/encryptor-spring-boot3-starter/src \
            --exclude spring.factories
          bash scripts/javax-to-jakarta.sh --diff \
            encryptor-starters/encryptor-web-starter/src encryptor-starters/encryptor-web-boot3-starter/src \
            --exclude spring.factories
          bash scripts/javax-to-jakarta.sh --diff \
            encryptor-starters/encryptor-gateway-starter/src encryptor-starters/encryptor-gateway-boot3-starter/src \
            --exclude spring.factories \
            --expect-diff main/java/io/github/cuukenn/encryptor/reactive/gateway/filter/EncryptorGatewayFilter.java \
            --expect-diff main/java/io/github/cuukenn/encryptor/reactive/gateway/filter/EncryptorResponseFilter.java \
            --expect-diff main/java/io/github/cuukenn/encryptor/reactive/gateway/discovery/JwksEndpointFilter.java
      # 依赖面守卫（boot3 线，同 build job JDK 8 档口径）：三个 boot3 starter 的
      # runtime 树不得出现 BC 或 encryptor-sm。encryptor-core 不在 -Pboot3 reactor，
      # 但它作为 boot3 starter 的依赖被解析进这棵树，传递闭包一并被扫；
      # core 直接树的守卫已由 build job（JDK 8 档）覆盖。
      # 两档矩阵里只跑一次，避免重复。
      - name: Guard BC-free runtime for boot3 starters
        if: matrix.java == '17'
        run: |
          rm -f /tmp/encryptor-boot3-runtime-tree.txt
          mvn -B -Pboot3 -pl encryptor-starters/encryptor-spring-boot3-starter,encryptor-starters/encryptor-web-boot3-starter,encryptor-starters/encryptor-gateway-boot3-starter \
            dependency:tree -Dscope=runtime \
            -DoutputFile=/tmp/encryptor-boot3-runtime-tree.txt -DappendOutput=true
          # 注：同 build job JDK 8 档，输出全量树而非 -Dincludes 过滤树（零命中时过滤树
          # 文件为 0 字节 → test -s 在干净树必红）；全量树恒非空。
          # 同 build job JDK 8 档：outputFile 非空才可信，空/缺失一律 fail 并说明。
          test -s /tmp/encryptor-boot3-runtime-tree.txt || { echo "dependency:tree 未产出输出，guard 不可信" >&2; exit 1; }
          if grep -qE "org\\.bouncycastle|io\\.github\\.cuukenn:encryptor-sm" /tmp/encryptor-boot3-runtime-tree.txt; then
            echo "BouncyCastle or encryptor-sm leaked into a boot3 starter runtime tree" >&2
            cat /tmp/encryptor-boot3-runtime-tree.txt >&2
            exit 1
          fi
