# Boot 3.5 网关示例（encryptor-gateway-boot3-starter 3.0.0 复制线 + reactive/micrometer 共享线 1.0.0）
server:
    port: 8080
spring:
    application:
        name: boot3-gateway-example
    cloud:
        gateway:
            server:
                webflux:
                    httpclient:
                        connect-timeout: 2000
                        response-timeout: 10s
encryptor:
    config:
        reactive:
            # 演示密钥：与 javax 线 gateway-example 相同的 gw-2026（RSA）+ ec-gw-2026（ECDH-ES/P-256）
            # —— node 前端 front/test.js 按 JWKS activeKid 取公钥封装，无需本地配置。
            keys:
                - kid: "gw-2026"
                  private-key: 
                  public-key: 
                # ECDH-ES（P-256）演示密钥：/test/hello 也可用 alg=ECDH-ES 直接密钥协商
                - kid: "ec-gw-2026"
                  type: EC
                  private-key: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCAdLDqUd8FiafeNakgfwsCASZeQ4zVZuJBNGlU39W96wg==
                  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAENUga2D1VBLz28WXokfukF7ucmsvxgQkBwZJl9qj3lSrnr6ukIK0mzN1O5Xuw2lIgHxc6ukqhxXHeO0nHiiMK5A==
            active-kid: "gw-2026"
            # 网关复制线的过滤链参数（黑名单/order/413 上限等）走 reactive 通用段 + gateway 段
            gateway:
                enable: true
# 下游路由由 Boot3GatewayExampleApplication 的 RouteLocator bean 按注入的
# downstream.base-uri 动态生成（/api/**、/test/**）；独立运行时 main 已自带一个
# 普通回显下游，也可以改用 javax 线 gateway-example/web（非 encryptor 普通 web 应用，
# 见 README）当真实下游。
