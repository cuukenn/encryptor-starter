server:
    port: 8081
encryptor:
    config:
        # v2 协议：JWE（RSA-OAEP-256 + A256GCM），报文载体是单个 jwe 字段
        keys:
            # 全局（默认）密钥：/test/hello 走这套
            - kid: "example-2026"
              # RSA PKCS#8（Base64）
              private-key: 
              # X.509/SPKI（Base64）
              public-key: 
            # uri 级 kid 白名单目标密钥：/test/secret.* 只接受这把
            - kid: "secret-2026"
              private-key: 
              public-key: 
            # ECDH-ES（P-256）演示密钥：/test/ec.* 只接受这把
            - kid: "ec-2026"
              type: EC
              private-key: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCCOc7AE+43yb/7wzQSUBfxhpyXeox4/SIaGvm16OSUgow==
              public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERw5R2QoVGBgjmTf//AbKaEw/XUxJREANRc8VUERWq9g9Q6qUyPF3g7M54R+2o9JWYM4qcKF9pEaIygB0pNo7JQ==
        active-kid: "example-2026"
        web:
            enable: true
            # uri 级 kid 白名单：key 是 uri 正则（整串匹配，StrKit），含 `.` 的 key 必须用括号写法 "[...]"
            # 命中该正则的请求只接受 kid=secret-2026 的 JWE 头；未命中走全局（active-kid）
            crypto-config:
                "[^/test/secret.*]": [ "secret-2026" ]
                # /test/ec.* 只接受 ECDH-ES(P-256) 那把，用来演示"uri 级绑密钥类型"
                "[/test/ec.*]": [ "ec-2026" ]
