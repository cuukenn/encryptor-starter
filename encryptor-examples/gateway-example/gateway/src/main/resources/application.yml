server:
    port: 8080
spring:
    cloud:
        gateway:
            routes:
                # 网关下游是普通应用（不引入 encryptor-starter），网关解密后转发明文
                - id: web
                  uri: http://127.0.0.1:8082
                  predicates:
                      - Path=/test/**
encryptor:
    config:
        reactive:
            # v2 协议：JWE（RSA-OAEP-256 + A256GCM），报文载体是单个 jwe 字段
            keys:
                - kid: "gw-2026"
                  private-key: 
                  public-key: 
                # ECDH-ES（P-256）演示密钥：/test/hello 也可用 alg=ECDH-ES 直接密钥协商
                - kid: "ec-gw-2026"
                  type: EC
                  private-key: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCAdLDqUd8FiafeNakgfwsCASZeQ4zVZuJBNGlU39W96wg==
                  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAENUga2D1VBLz28WXokfukF7ucmsvxgQkBwZJl9qj3lSrnr6ukIK0mzN1O5Xuw2lIgHxc6ukqhxXHeO0nHiiMK5A==
            active-kid: "gw-2026"
            gateway:
                enable: true
